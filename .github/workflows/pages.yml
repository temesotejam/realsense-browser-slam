name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check src/main.js
          node --check src/depth-source.js
          node --check src/render.js
          node --check src/slam-worker.js
          node --check src/main-build-20260925-4.js
          node --check src/legacy-depth-source-build-20260925-4.js
          node --check src/main-build-20260925-5.js
          node --check src/legacy-depth-source-build-20260925-5.js
          node --check src/main-build-20260925-6.js
          node --check src/legacy-depth-source-build-20260925-6.js
          node --check src/main-build-20260925-7.js
          node --check src/main-build-20260925-8.js
          node --check src/slam-worker-build-20260925-8.js
          node --check src/main-build-20260925-9.js
          node --check src/legacy-depth-source-build-20260925-9.js
          node --check src/slam-worker-build-20260925-9.js
          node --check src/main-build-20260925-10.js
          node --check src/slam-worker-build-20260925-10.js
          node --check src/main-build-20260925-11.js
          node --check src/slam-worker-build-20260925-11.js
          node --check src/main-build-20260925-12.js
          node --check src/slam-worker-build-20260925-12.js
          node --check src/main-build-20260925-13.js
          node --check src/slam-worker-build-20260925-13.js
          node --check src/main-build-20260925-14.js
          node --check src/slam-worker-build-20260925-14.js
          node --check src/main-build-20260925-15.js
          node --check src/slam-worker-build-20260925-15.js
          node --check src/main-build-20260925-16.js
          node --check src/slam-worker-build-20260925-16.js
          node --check src/main-build-20260925-17.js
          node --check src/slam-worker-build-20260925-17.js
          node --check src/main-build-20260925-18.js
          node --check src/slam-worker-build-20260925-18.js
          node --check src/main-build-20260925-19.js
          node --check src/slam-worker-build-20260925-19.js
          node --check src/main-build-20260925-20.js
          node --check src/slam-worker-build-20260925-20.js
          node --check src/rgb-feature-source-build-20260925-21.js
          node --check src/main-build-20260925-21.js
          node --check src/slam-worker-build-20260925-21.js
          node --check src/main-build-20260925-22.js
          node --check src/slam-worker-build-20260925-22.js
          node --check src/rgb-feature-source-build-20260925-21.js
          node --check src/main-build-20260925-21.js
          node --check src/slam-worker-build-20260925-21.js
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
